# Build and test CourseShelf on macOS, Windows and Linux for every push and pull request, and keep the built app as a
# download (Actions -> the run -> Artifacts). The builds are not signed: see "Ready-made builds" in README.md.
# For a tag vX.Y.Z (or a manual run given a tag), the "release" job attaches the installers to that GitHub release, which
# is where the app's self-update looks (crates/core/src/update.rs, pick_asset: *_aarch64.app.zip, *_x64-setup.exe, *_amd64.deb).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the installers to this existing release tag (vX.Y.Z); its version must match the code on the branch"
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, bundles: app }
          - { name: Windows, os: windows-latest, bundles: nsis }
          - { name: Linux, os: ubuntu-latest, bundles: deb }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux libraries for the Tauri window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # the server embeds web/dist at compile time, so the UI is built first
      - name: UI (type check and build)
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Tests (core, server, downloader)
        run: cargo test --workspace --exclude courseshelf-app

      - name: Downloader (courseshelf-fetch)
        run: cargo build --release -p courseshelf-fetch

      - name: App
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}

      - name: Collect the files to download
        shell: bash
        run: |
          mkdir out
          case "$RUNNER_OS" in
            macOS)   version=$(sed -n 's/^ *"version": *"\(.*\)",*$/\1/p' app/src-tauri/tauri.conf.json)
                     ditto -c -k --keepParent target/release/bundle/macos/CourseShelf.app "out/CourseShelf_${version}_aarch64.app.zip"
                     cp target/release/courseshelf-fetch out/ ;;
            Windows) cp target/release/bundle/nsis/*.exe out/
                     cp target/release/courseshelf-fetch.exe out/ ;;
            Linux)   cp target/release/bundle/deb/*.deb out/
                     cp target/release/courseshelf-fetch out/ ;;
          esac
          ls -l out

      - uses: actions/upload-artifact@v5
        with:
          name: CourseShelf-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  release:
    name: Attach installers to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "v$version" != "$TAG" ]; then
            echo "the code is version $version but the tag is $TAG"; exit 1
          fi
          # a release made by hand keeps its notes; otherwise make one (published, so releases/latest and the app see it)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "CourseShelf $version" --generate-notes
          ls -l dist
          gh release upload "$TAG" --clobber dist/*.app.zip dist/*-setup.exe dist/*.deb
